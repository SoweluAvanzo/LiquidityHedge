# Docker-secrets overlay — credentials as mounted files, never env vars.
#
# WHY. An environment variable holding a password is readable via
# `docker inspect`, via /proc/<pid>/environ, in crash dumps, and is
# inherited by every child process the container spawns. A secret mounted
# at /run/secrets/<name> is a file owned by the container user and nothing
# else, and it never appears in the process environment at all.
#
# USE
#   mkdir -p deploy/secrets && chmod 700 deploy/secrets
#   printf '%s' 'REDACTED' > deploy/secrets/postgres_password
#   printf '%s' 'REDACTED' > deploy/secrets/lh_writer_password
#   printf '%s' 'REDACTED' > deploy/secrets/lh_reader_password
#   printf '%s' 'REDACTED' > deploy/secrets/birdeye_api_key
#   printf '%s' 'REDACTED' > deploy/secrets/resend_api_key
#   chmod 600 deploy/secrets/*
#
#   docker compose -f docker-compose.yml -f compose.secrets.yml up -d
#
# `printf` rather than `echo` so no trailing newline lands in the secret
# (the reader trims anyway, but a secret file should hold exactly the
# secret). deploy/secrets/ is gitignored.
#
# The app resolves every credential through `secretEnv()` in
# @lh/storage: for any variable X, X_FILE wins over X. So this overlay
# only has to point X_FILE at the mount.
#
# On Swarm / a managed host, replace the `file:` sources below with
# `external: true` and load the secrets from the platform's own store —
# nothing else changes.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  lh_writer_password:
    file: ./secrets/lh_writer_password
  lh_reader_password:
    file: ./secrets/lh_reader_password
  birdeye_api_key:
    file: ./secrets/birdeye_api_key
  resend_api_key:
    file: ./secrets/resend_api_key

services:
  postgres:
    # The official image supports the _FILE convention natively.
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      LH_WRITER_PASSWORD_FILE: /run/secrets/lh_writer_password
      LH_READER_PASSWORD_FILE: /run/secrets/lh_reader_password
    secrets:
      - postgres_password
      - lh_writer_password
      - lh_reader_password

  migrate:
    environment:
      # Assembled at runtime from PG parts so the password is never
      # interpolated into a URL by the shell.
      DATABASE_URL_MIGRATOR: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lh_admin}
      PGDATABASE: ${POSTGRES_DB:-lh}
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  web:
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: lh_writer
      PGDATABASE: ${POSTGRES_DB:-lh}
      PGPASSWORD_FILE: /run/secrets/lh_writer_password
      BIRDEYE_API_KEY: ""
      BIRDEYE_API_KEY_FILE: /run/secrets/birdeye_api_key
    secrets:
      - lh_writer_password
      - birdeye_api_key

  snapshot-collector:
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: lh_writer
      PGDATABASE: ${POSTGRES_DB:-lh}
      PGPASSWORD_FILE: /run/secrets/lh_writer_password
    secrets:
      - lh_writer_password

  backup:
    environment:
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  data-reporter:
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: lh_reader
      PGDATABASE: ${POSTGRES_DB:-lh}
      PGPASSWORD_FILE: /run/secrets/lh_reader_password
      RESEND_API_KEY: ""
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      BIRDEYE_API_KEY: ""
      BIRDEYE_API_KEY_FILE: /run/secrets/birdeye_api_key
    secrets:
      - lh_reader_password
      - resend_api_key
      - birdeye_api_key
