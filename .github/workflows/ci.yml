name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: "@lh/core — typecheck + 200 tests (incl. differential parity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install (platform workspace)
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: platform
        run: pnpm -r typecheck
      - name: Test (legacy 192 + differential parity vs prototype)
        working-directory: platform
        run: pnpm -r test

  prototype:
    name: "lh-protocol prototype — 192 reference tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: lh-protocol
        run: yarn install --frozen-lockfile
      - name: Test
        working-directory: lh-protocol
        run: yarn test

  secrets-scan:
    name: "Secret scanning (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: "Dependency vulnerability audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install
        working-directory: platform
        run: pnpm install --frozen-lockfile
      # Report everything (visibility), but only FAIL on advisories in
      # dependencies we can actually act on. Transitive advisories in the
      # toolchain (eslint→minimatch→brace-expansion, sharp/libvips, …) are
      # tracked here without blocking every commit; NFR-SEC4 review of this
      # report is part of the release checklist.
      - name: Audit report (non-blocking)
        working-directory: platform
        run: pnpm audit --audit-level moderate || true
      # Blocking gate: CRITICAL advisories in production dependencies.
      # Documented residual HIGHs with no actionable fix (reviewed
      # 2026-07-26, see product-design/05_security_residuals.md):
      #  - bigint-buffer: NO upstream fix exists (1.1.5 is latest published);
      #    native build scripts are declined, so the vulnerable native path
      #    is never compiled — the pure-JS fallback is used.
      #  - postcss / sharp: pinned forward via pnpm overrides where possible;
      #    remaining paths come from next's own pinned ranges. sharp is not
      #    exercised (images.unoptimized: true, build scripts declined).
      - name: Audit production dependencies (blocking on critical)
        working-directory: platform
        run: pnpm audit --prod --audit-level critical

  docker:
    name: "Docker images build (web + ops-jobs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f platform/apps/web/Dockerfile -t lh-web:ci .
      - name: Build ops-jobs image
        run: docker build -f platform/services/ops-jobs/Dockerfile -t lh-ops-jobs:ci .
      - name: Compose config sanity
        working-directory: platform/deploy
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f compose.local.yml config -q

  sast:
    name: "Static analysis (semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # `--error` would fail the build on any finding, including advisory
      # ones in test fixtures; findings are printed for review instead and
      # triaged in the security checklist (NFR-SEC7).
      - name: Semgrep scan
        run: semgrep scan --config auto --exclude node_modules platform lh-protocol/protocol-src
